; MajiSafe station firmware — LilyGO T-Call ESP32 + SIM800L
[platformio]
default_envs = lilygo-tcall

[env:lilygo-tcall]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
  bblanchon/ArduinoJson @ ^7.2.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=2
