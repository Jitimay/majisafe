name: majisafe_app
description: "Regideso Wallet — MajiSafe mobile client for REGIDESO water credits."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  connectivity_plus: ^6.1.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/majisafe_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/majisafe_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/majisafe_logo.png
